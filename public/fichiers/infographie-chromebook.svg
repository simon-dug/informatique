  <title id="titre-affiche">Affiche : Mon Chromebook, j'en prends soin</title>
  <desc id="desc-affiche">Affiche « Mon Chromebook, j'en prends soin » : les sept réflexes d'entretien — transport avec soin, éloigner nourriture et liquides, arriver chargé, nettoyer l'écran comme il faut, ranger au bon endroit, garder au chaud, garder sa session en santé — et la consigne de signaler tout bris au technicien informatique de l'école.</desc>
