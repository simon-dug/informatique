    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
  .poster { box-sizing: border-box; width: 1080px; padding: 64px 64px 56px; font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, "Noto Sans", sans-serif; }
  .poster * { box-sizing: border-box; }
  .entete { text-align: center; margin-bottom: 44px; }
  .entete h1 { margin: 0; color: #ffffff; font-size: 56px; font-weight: 800; line-height: 1.22; letter-spacing: -0.01em; }
  .trait { width: 120px; height: 6px; border-radius: 999px; background: linear-gradient(90deg, #38bdf8, #7dd3fc); margin: 26px auto 0; }
  .cartes { display: flex; flex-direction: column; gap: 24px; }
  .carte { display: flex; align-items: flex-start; gap: 24px; background: #ffffff; border-radius: 20px; padding: 28px 32px; box-shadow: 0 10px 30px rgba(4, 16, 31, 0.35); }
  .carte--attention { background: #fff6e0; border-left: 8px solid #e8960c; padding-left: 24px; }
  .badge { flex: none; width: 58px; height: 58px; border-radius: 50%; background: #38bdf8; color: #04101f; font-size: 26px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .badge--attention { background: #f6b83a; font-size: 28px; }
  .texte h2 { margin: 0 0 8px; color: #0b2a52; font-size: 27px; font-weight: 800; line-height: 1.25; }
  .texte p { margin: 0; color: #2c4058; font-size: 22px; line-height: 1.48; }
  .carte--attention .texte p { color: #5b3d06; }
  .credit { text-align: center; margin-top: 46px; color: #7dd3fc; font-size: 19px; font-weight: 600; letter-spacing: 0.02em; }
  .credit span { color: #b6def8; font-weight: 400; }
</style>
      
    <div class="poster">
      <div class="entete">
        <h1>Mon Chromebook, j'en prends soin 💻</h1>
        <div class="trait"></div>
      </div>
      <div class="cartes">
        
      <div class="carte">
        <div class="badge">1</div>
        <div class="texte">
          <h2>Je le transporte avec soin</h2>
          <p>Toujours fermé, à deux mains ou dans la housse. Jamais tenu par l'écran. Rien sur le clavier avant de fermer (un crayon oublié = écran fissuré).</p>
        </div>
      </div>
      <div class="carte">
        <div class="badge">2</div>
        <div class="texte">
          <h2>J'écarte la nourriture et les liquides</h2>
          <p>Aucune bouteille ouverte ni nourriture à proximité de l'appareil. Mains propres et sèches.</p>
        </div>
      </div>
      <div class="carte">
        <div class="badge">3</div>
        <div class="texte">
          <h2>J'arrive chargé</h2>
          <p>Je branche l'appareil chaque soir à la maison. Je débranche par la fiche, jamais en tirant sur le fil.</p>
        </div>
      </div>
      <div class="carte">
        <div class="badge">4</div>
        <div class="texte">
          <h2>Je nettoie l'écran comme il faut</h2>
          <p>Chiffon microfibre sec (ou à peine humide). Jamais de Windex, d'alcool ni de papier brun.</p>
        </div>
      </div>
      <div class="carte">
        <div class="badge">5</div>
        <div class="texte">
          <h2>Je range au bon endroit</h2>
          <p>À l'école : dans mon casier, jamais empilé sous des livres ni écrasé au fond de mon sac.<br/>À la maison : sur une surface stable et dégagée (bureau, table de travail), loin du bord. Jamais sur le comptoir de cuisine, près de l'évier ou de la cuisinière, ni sur un lit, un divan ou une chaise où il peut tomber ou se faire écraser.</p>
        </div>
      </div>
      <div class="carte">
        <div class="badge">6</div>
        <div class="texte">
          <h2>Je le garde au chaud</h2>
          <p>Je ne le laisse jamais dans l'auto ni dehors : le froid et les écarts de température abîment la batterie et l'écran. Je le rentre avec moi, et je le laisse tiédir avant de l'ouvrir s'il a pris froid.</p>
        </div>
      </div>
      <div class="carte">
        <div class="badge">7</div>
        <div class="texte">
          <h2>Je garde ma session en santé</h2>
          <p>Je redémarre au moins une fois par semaine, je ferme les onglets inutiles et je n'installe pas d'extensions non autorisées.</p>
        </div>
      </div>
        <div class="carte carte--attention">
          <div class="badge badge--attention">⚠️</div>
          <div class="texte">
            <p>Un bris, une touche décollée, une fissure ? Je le signale tout de suite au technicien informatique de l'école — je n'essaie pas de le réparer moi-même.</p>
          </div>
        </div>
      </div>
      <p class="credit">cours.simonduguay.com <span>· Le numérique avec Simon</span></p>
    </div>
  
    </div>
  </foreignObject>
</svg>